[project]
name = "f2dvim"
description = "Fresh2dev's Neovim config"
readme = "README.pypi.md"
requires-python = ">=3.12.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Donald Mellenbruch", email = "hello@f2dv.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://f2dv.com/r/f2dvim"
Repository = "https://github.com/fresh2dev/f2dvim"
# Funding = "https://f2dv.com/fund"

[project.scripts]
f2dvim = "f2dvim.__main__:main"

[project.optional-dependencies]

[dependency-groups]
dev = [
  # Lets the type checkers resolve the imports in scripts/hatch_build.py.
  "hatchling>=1.27",
  { include-group = "tests" },
]
tests = [
  "pytest==9.*",
]

[build-system]
requires = ["hatch-fancy-pypi-readme", "hatchling>=1.8.0", "uv-dynamic-versioning>=0.8.0"]
build-backend = "hatchling.build"

[tool.f2dvim]
# The Neovim config to package, relative to this file.
config-dir = "config"
# The Exclusion list: Plugin files (relative to config-dir) left out of f2dvim.
exclude = [
  "plugin/90-treesitter.lua",
  "plugin/99-zellij.lua",
  "plugin/99-zellij-agent-pane.lua",
]

# SPDX ids for Plugins that state their license only in their README or docs.
[tool.f2dvim.licenses]
"conflict-marker.vim" = "MIT"
"vim-easy-align" = "MIT"
"vim-eunuch" = "Vim"
"vim-flog" = "Vim"
"vim-fugitive" = "Vim"
"vim-repeat" = "Vim"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "src/f2dvim/__version__.py"
template = '''
__version__ = "{version}"
'''

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

# scripts/hatch_build.py stages the Neovim config and its Plugins into the wheel.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pyrefly]
# bundle.py lives in scripts/, outside src/.
search-path = ["scripts"]

[tool.pytest]
# The tests import bundle.py, which lives in scripts/, outside src/.
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
unsafe-fixes = true
output-format = "concise"

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
default-groups = ["dev"]

# Target of `just publish-test` (uv publish --index testpypi).
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
# mockish = { path = "../mockish", editable = true }
# yapx = { path = "../yapx", editable = true }

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
metadata = true
bump = true

[tool.zuban]
mypy_path = ["scripts"]
